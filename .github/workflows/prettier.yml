name: Formatting validation

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Prettier Check
        id: prettier-run
        run: |
          if npx prettier --check .; then
            echo "prettier_output=All files are formatted correctly" >> $GITHUB_OUTPUT
          else
            echo "prettier_output=Some files are not formatted correctly" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Prettier Output
        if: failure()
        shell: bash
        run: |
          echo "::error::The following files aren't formatted properly:"
          npx prettier --check . || true
          echo ""
          echo "To fix formatting issues, run:"
          echo "  npx prettier --write ."

      - name: Format Output
        if: always()
        run: |
          echo "Prettier check completed with status: ${{ steps.prettier-run.outcome }}"
